<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AFTERIMAGE — two players</title>
    <style>
      body { margin: 0; padding: 32px; background: #f4f1ea; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      main { display: grid; gap: 48px; max-width: 1100px; margin: 0 auto; }
      h1 { margin: 0; font-size: 22px; }
    </style>
    <script type="module">
      import '@videojs/html/video/player';
      import '/dist-skin/afterimage-skin.js';
    </script>
  </head>
  <body>
    <main>
      <h1>A host page with its own styles and two AFTERIMAGE players (built bundle)</h1>

      <!-- With a catalogue record -->
      <video-player>
        <afterimage-skin>
          <video src="https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/highest.mp4" crossorigin="anonymous" playsinline preload="metadata">
            <track kind="metadata" label="thumbnails" src="https://image.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/storyboard.vtt" default />
          </video>
          <afterimage-catalogue title="Second Reel" archive-id="REEL 002">Only an ID and a title.</afterimage-catalogue>
        </afterimage-skin>
      </video-player>

      <!-- Bare: no catalogue, no chapters, accent overridden from the page -->
      <video-player>
        <afterimage-skin style="--ai-accent: #3d7bff; --ai-accent-rgb: 61 123 255">
          <video src="https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/highest.mp4" crossorigin="anonymous" playsinline preload="metadata"></video>
        </afterimage-skin>
      </video-player>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0706" />
    <meta name="description" content="AFTERIMAGE — a system for exploring moving images." />
    <title>AFTERIMAGE — The Last Light</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' fill='%230c0706'/%3E%3Ccircle cx='9' cy='9' r='4' fill='none' stroke='%23FF4B2E' stroke-width='1.5'/%3E%3Cpath d='M9 1.5v3.5M9 13v3.5M1.5 9H5M13 9h3.5' stroke='%23F3DCD0' stroke-width='1.5'/%3E%3C/svg%3E" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="ai-skip" href="#reel">Skip to player</a>

    <!--
      AFTERIMAGE as any project would use it: a Video.js player, the skin,
      the project's own <video>, and an optional catalogue record.
    -->
    <video-player>
      <afterimage-skin id="reel">
        <video
          src="https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/highest.mp4"
          poster="https://image.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/thumbnail.webp?time=3&amp;width=1280"
          crossorigin="anonymous"
          playsinline
          preload="metadata"
        >
          <track kind="metadata" label="thumbnails" src="https://image.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/storyboard.vtt" default />
          <track kind="chapters" srclang="en" label="Chapters" src="/chapters.vtt" default />
        </video>

        <afterimage-catalogue
          title="The Last Light"
          archive-id="REEL 001"
          collection="COLLECTION 04"
          format="Digital Video"
          source="Video.js sample media, streamed from Mux. Sample metadata for demonstration."
        >
          A short sequence of found summers: a tape slid into a deck, boards on the boardwalk at dusk, arcades,
          bicycles, and a night that ends in fireworks. Catalogued as a study in warm light and its afterimage.
        </afterimage-catalogue>
      </afterimage-skin>
    </video-player>
  </body>
</html>
